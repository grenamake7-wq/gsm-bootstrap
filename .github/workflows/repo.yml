name: Repo GSM
on:
  workflow_dispatch:
    inputs:
      nama_paket:
        description: "Nama paket aplikasi (menentukan folder /data/data/NAMA/files/usr)"
        required: true
        default: "com.garuda.simplemanager"
      paket:
        description: "Paket yang dibangun, pisahkan dengan koma"
        required: true
        default: "ripgrep"
      tag:
        description: "Nama rilis GitHub yang menjadi repo apt"
        required: true
        default: "apt"
      dari_run:
        description: "Nomor run sebelumnya: lewati pembangunan, terbitkan saja deb dari run itu (kosong = bangun baru)"
        required: false
        default: ""
permissions:
  contents: write
  actions: read
jobs:
  bangun:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Ambil sumber paket Termux
        if: inputs.dari_run == ''
        uses: actions/checkout@v4
        with:
          repository: termux/termux-packages
          path: tp
          fetch-depth: 1
      - name: Bebaskan ruang disk
        if: inputs.dari_run == ''
        working-directory: tp
        run: ./scripts/free-space.sh
      - name: Ganti nama paket aplikasi
        if: inputs.dari_run == ''
        working-directory: tp
        env:
          NAMA: ${{ inputs.nama_paket }}
        run: |
          sed -i "s|^TERMUX_APP__PACKAGE_NAME=.*|TERMUX_APP__PACKAGE_NAME=\"${NAMA}\"|" scripts/properties.sh
          grep -n '^TERMUX_APP__PACKAGE_NAME=' scripts/properties.sh
      - name: Bangun paket
        if: inputs.dari_run == ''
        working-directory: tp
        timeout-minutes: 320
        env:
          DAFTAR: ${{ inputs.paket }}
        run: |
          set -o pipefail
          mkdir -p ../hasil
          : > ../build.log
          GAGAL=""
          for n in $(echo "$DAFTAR" | tr ',' ' '); do
            if [ -f "packages/$n/build.sh" ]; then
              p="$n"
            else
              f="$(ls packages/*/"$n".subpackage.sh 2>/dev/null | head -1 || true)"
              if [ -n "$f" ]; then p="$(basename "$(dirname "$f")")"; echo "Sub-paket $n dibangun lewat paket $p" | tee -a ../build.log; else echo "Paket $n gagal: tidak ada di sumber Termux" | tee -a ../build.log; GAGAL="$GAGAL $n"; continue; fi
            fi
            ok=0
            for t in 1 2; do
              echo "=== $p, percobaan $t dari 2 ===" | tee -a ../build.log
              if ./scripts/run-docker.sh ./build-package.sh -i -a aarch64 "$p" 2>&1 | tee -a ../build.log; then ok=1; break; fi
              sleep 20
            done
            if [ "$ok" = 0 ]; then echo "Paket $p gagal dibangun" | tee -a ../build.log; GAGAL="$GAGAL $p"; fi
          done
          echo "GAGAL:$GAGAL" | tee -a ../build.log
          echo "GAGAL=$GAGAL" >> "$GITHUB_ENV"
      - name: Kumpulkan paket deb
        if: always() && inputs.dari_run == ''
        run: |
          sudo chown -R "$(id -u):$(id -g)" tp/output 2>/dev/null || true
          mkdir -p hasil
          echo "--- isi tp/output ---"
          ls -la tp/output 2>/dev/null | head -30 || true
          cp -f tp/output/*.deb hasil/ 2>/dev/null || true
          if ! ls hasil/*.deb >/dev/null 2>&1; then
            echo "tp/output tidak berisi deb. Mencoba menyalin dari kontainer docker."
            docker ps -a --format '{{.Names}}' || true
            for c in $(docker ps -a --format '{{.Names}}' 2>/dev/null); do
              docker cp "$c:/home/builder/termux-packages/output/." hasil/ 2>/dev/null || true
            done
            find hasil -type f ! -name '*.deb' -delete 2>/dev/null || true
          fi
          if ! ls hasil/*.deb >/dev/null 2>&1; then
            echo "Masih kosong. Mencari deb di seluruh disk."
            find / -xdev -name '*_aarch64.deb' -size +1k 2>/dev/null | head -80 | while read -r f; do echo "ketemu: $f"; cp -f "$f" hasil/; done
          fi
          cd hasil
          for f in *.deb; do
            [ -e "$f" ] || continue
            n="$(printf '%s' "$f" | sed 's/+/plus/g; s/[^A-Za-z0-9._-]/-/g')"
            [ "$f" = "$n" ] || mv -f "$f" "$n"
          done
          echo "--- hasil ---"
          ls -la | head -80
      - name: Ambil paket dari run sebelumnya
        if: inputs.dari_run != ''
        run: |
          mkdir -p hasil
          gh run download "${{ inputs.dari_run }}" -n deb -D hasil
          ls -la hasil | head -80
      - name: Terbitkan repo apt
        if: always()
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -e
          if ! ls hasil/*.deb >/dev/null 2>&1; then echo "Tidak ada .deb baru, repo tidak diubah"; exit 0; fi
          sudo apt-get install -y -qq apt-utils >/dev/null 2>&1 || true
          mkdir -p pub
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Repo apt GSM" --notes "Repo paket apt GSM (aarch64). Pakai: deb [trusted=yes] URL ./"
          gh release download "$TAG" --dir pub --pattern '*.deb' || true
          cp -f hasil/*.deb pub/
          cd pub
          apt-ftparchive packages . > Packages
          gzip -k -f Packages
          apt-ftparchive release . > Release
          gh release upload "$TAG" ./*.deb Packages Packages.gz Release --clobber
          echo "Jumlah paket di indeks: $(grep -c '^Package:' Packages)"
      - name: Simpan log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: log
          path: build.log
          if-no-files-found: ignore
      - name: Simpan paket deb (cadangan 14 hari)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: deb
          path: hasil/*.deb
          retention-days: 14
          if-no-files-found: ignore
      - name: Gagalkan bila ada paket yang gagal
        if: always()
        run: |
          if [ -n "${GAGAL:-}" ]; then echo "Paket gagal:$GAGAL"; exit 1; fi
